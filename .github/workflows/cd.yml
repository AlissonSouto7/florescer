name: CD

# Promoção de artefato: a MESMA imagem não é reconstruída a cada ambiente, cada
# ambiente ganha sua tag a partir da branch que o alimenta.
#
#   develop      -> :dev        -> environment development (automático)
#   release/x.y.z-> :x.y.z-rc   -> environment staging     (automático)
#   tag vX.Y.Z   -> :X.Y.Z      -> environment production  (exige aprovação manual)
on:
  push:
    branches: [develop, 'release/**']
    tags: ['v*.*.*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve environment and image tag
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#release/}-rc" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish ${{ matrix.service }} to ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    # O environment é o gate: production tem required reviewer configurado no GitHub,
    # então este job fica parado esperando aprovação humana antes de rodar.
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      packages: write
      # Publica o resultado do scan da imagem na aba Security.
      security-events: write
    strategy:
      matrix:
        service: [auth-service, product-service, florescer-web]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulação para construir a imagem ARM num runner x86. Sem ela, o build
      # multiplataforma falha no primeiro comando que rodar dentro do estágio
      # ARM, com um "exec format error" que não diz de onde veio.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Nome de imagem Docker precisa ser minúsculo, e o dono do repositório no
      # GitHub pode ter maiúsculas. Resolvido uma vez e reusado nos passos
      # seguintes, para o scan apontar exatamente para a imagem publicada.
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REGISTRY}/${REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Gera as tags e os labels OCI padrão, que gravam na própria imagem de
      # qual commit e de qual repositório ela veio.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service }}
          # amd64 para servidor comum, arm64 porque as máquinas gratuitas de
          # nuvem costumam ser ARM. Sem a segunda, a imagem não roda lá, e o erro
          # só aparece no destino, depois do deploy.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A imagem carrega mais do que o nosso código: distribuição base, JRE e
      # bibliotecas de sistema. O Dependabot não enxerga essa camada.
      - name: Scan image for vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Escaneia pelo digest, que aponta para o binário exato que acabou de
          # ser publicado, e não para uma tag que pode ser movida depois.
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Sem o guard, um scan que nem chegou a rodar faz o upload falhar
      # procurando um arquivo que não existe, escondendo o erro real.
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: steps.scan.outcome == 'success'
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  deploy:
    name: deploy to ${{ needs.resolve.outputs.environment }}
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      # Ainda não há servidor de destino. Quando houver, este passo puxa a imagem
      # já publicada (nunca reconstrói) e roda o smoke test contra o ambiente.
      - name: Deploy placeholder
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Imagens prontas para deploy em ${{ needs.resolve.outputs.environment }}:"
          for servico in auth-service product-service florescer-web; do
            echo "  ${REGISTRY}/${REPOSITORY,,}/${servico}:${{ needs.resolve.outputs.tag }}"
          done
          echo "Destino de deploy ainda não configurado (ver docs/workflow/05-ambientes-e-deploy.md)."
