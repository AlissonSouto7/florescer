name: CD

# Promoção de artefato: a MESMA imagem não é reconstruída a cada ambiente, cada
# ambiente ganha sua tag a partir da branch que o alimenta.
#
#   develop      -> :dev        -> environment development (automático)
#   release/x.y.z-> :x.y.z-rc   -> environment staging     (automático)
#   tag vX.Y.Z   -> :X.Y.Z      -> environment production  (exige aprovação manual)
on:
  push:
    branches: [develop, 'release/**']
    tags: ['v*.*.*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve environment and image tag
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#release/}-rc" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish ${{ matrix.service }} to ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    # O environment é o gate: production tem required reviewer configurado no GitHub,
    # então este job fica parado esperando aprovação humana antes de rodar.
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, product-service]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to ${{ needs.resolve.outputs.environment }}
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      # Ainda não há servidor de destino. Quando houver, este passo puxa a imagem
      # já publicada (nunca reconstrói) e roda o smoke test contra o ambiente.
      - name: Deploy placeholder
        run: |
          echo "Imagem pronta para deploy em ${{ needs.resolve.outputs.environment }}:"
          echo "  ${{ env.REGISTRY }}/${{ github.repository }}/auth-service:${{ needs.resolve.outputs.tag }}"
          echo "  ${{ env.REGISTRY }}/${{ github.repository }}/product-service:${{ needs.resolve.outputs.tag }}"
          echo "Destino de deploy ainda não configurado (ver docs/workflow/05-ambientes-e-deploy.md)."
