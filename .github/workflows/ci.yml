name: CI

# Roda em todo PR e em todo push para as branches de integração.
# Os jobs deste workflow são os status checks obrigatórios das branch protection rules:
# nenhum merge acontece sem eles verdes.
on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main]

# Um PR novo cancela a execução anterior da mesma branch: economiza runner e
# evita revisar resultado de código que já mudou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast desligado: se o auth quebrar, ainda quero saber se o product passa.
      fail-fast: false
      matrix:
        service: [auth-service, product-service]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # verify roda compile + testes (Testcontainers sobe o banco real via Docker,
      # já disponível no runner) + relatório JaCoCo + gate de cobertura.
      - name: Build, test and coverage gate
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  frontend:
    name: build (florescer-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: florescer-web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: florescer-web/package-lock.json

      # ci, e não install: instala exatamente o que está no lockfile e falha se
      # ele divergir do package.json, em vez de resolver versões novas por conta.
      - name: Install
        run: npm ci

      - name: Test and coverage gate
        run: npm run test:coverage

      # O build é verificação, não só empacotamento: o TypeScript roda em modo
      # estrito e reprova tipo quebrado que os testes não alcançariam.
      - name: Build
        run: npm run build
        env:
          # O build não fala com a API, mas o Next congela o destino do rewrite
          # de /uploads neste momento. Um valor previsível aqui evita depender do
          # que estiver no ambiente do runner.
          PRODUCT_API: http://product-service:8081

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-florescer-web
          path: florescer-web/coverage/
          retention-days: 7

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necessária para o gitleaks comentar o achado no próprio pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Histórico completo: o scan olha os commits do PR, não só a árvore final.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Regras padrão do gitleaks mais as exceções documentadas no arquivo.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
