server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. O navegador só aplica o que o servidor manda
    # aplicar: sem eles, uma falha de XSS que passe pelo escape do JS não
    # encontra nenhuma barreira do lado do cliente.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A CSP precisa liberar as duas APIs em connect-src, senão o fetch é
    # bloqueado. Os endereços são de desenvolvimento: em publicação real este
    # arquivo é substituído junto com o config.js.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' http://localhost:8081 data:; connect-src 'self' http://localhost:8080 http://localhost:8081; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Usado pelo healthcheck do compose. Não serve arquivo, só responde.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
