# Sobe a stack inteira: os dois bancos, os dois serviços e o frontend.
#
# Antes existiam dois compose separados, cada um subindo apenas o seu banco. Isso
# tinha três problemas: os dados sumiam a cada `down` porque não havia volume
# nomeado, não havia como levantar o sistema completo com um comando, e as duas
# pastas se chamavam `docker`, então o Compose derivava o mesmo nome de projeto
# para ambas e as redes colidiam.
#
# Uso:
#   cp .env.example .env   e preencha (o par RSA é obrigatório, ver README)
#   docker compose up --build
name: florescer

services:

  # --- bancos -------------------------------------------------------------
  # Publicados só em 127.0.0.1. Sem o prefixo, o Docker abre a porta em todas as
  # interfaces e passa por cima do firewall do host: um banco de desenvolvimento
  # com senha fraca fica exposto na rede local.
  #
  # A porta do host é configurável porque 3306 e 5432 são as portas óbvias e
  # costumam já estar tomadas por outro projeto na mesma máquina. Só o lado do
  # host muda: dentro da rede do Compose os serviços continuam se falando pelas
  # portas padrão, então nada além do acesso externo é afetado.

  auth-db:
    # Tag fixa e completa. `mysql` sozinho segue a latest e troca de major sem
    # avisar, e migration escrita para uma versão não vale para a seguinte.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: authdb
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-3306}:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      # A porta abrir não significa que o banco aceita conexão: o MySQL escuta
      # antes de terminar a inicialização, e quem conectar nesse intervalo leva
      # erro. O ping responde só quando ele está pronto de verdade.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [florescer]

  product-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dbproduct
    ports:
      - "127.0.0.1:${PRODUCT_DB_PORT:-5432}:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dbproduct"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [florescer]

  # --- aplicações ---------------------------------------------------------

  auth-service:
    build:
      context: ./auth-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Dentro da rede do Compose o host é o nome do serviço, não localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Documentacao viva ligada so aqui: em producao o padrao e desligado.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_PSEUDONYM_SALT: ${LOG_PSEUDONYM_SALT:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # De qual endereço o site fala com este serviço.
      #
      # É o que separa um visitante do outro no limite de tentativas de login.
      # Sem isto, toda tentativa chega do mesmo lugar (o site) e divide a mesma
      # cota: dez senhas erradas de um desconhecido trancam a vendedora por um
      # minuto, e repetir a cada minuto a mantém fora do painel. Custa dez
      # requisições e não exige conta nenhuma.
      #
      # Só o endereço listado aqui tem o X-Forwarded-For lido. De qualquer outra
      # origem vale o endereço da conexão, senão bastaria mandar o cabeçalho
      # para escolher a própria cota e o limite deixaria de existir.
      APP_RATE_LIMIT_TRUSTED_PROXIES: ${APP_RATE_LIMIT_TRUSTED_PROXIES:-172.28.0.10}
      # Quantos proxies existem entre o visitante e este serviço: 1 com o site
      # na frente, 2 quando há um túnel ou CDN antes dele.
      APP_RATE_LIMIT_TRUSTED_HOPS: ${APP_RATE_LIMIT_TRUSTED_HOPS:-1}
    ports:
      # Em 127.0.0.1, como os bancos: em desenvolvimento a API é alcançada
      # pelo site, e publicá-la em todas as interfaces a deixa disponível
      # para qualquer máquina da rede local, sem que nada peça isso.
      - "127.0.0.1:${AUTH_PORT:-8080}:8080"
    depends_on:
      auth-db:
        # `service_started` só garante que o container subiu. Com `service_healthy`
        # a aplicação espera o banco aceitar conexão, senão o Flyway falha no boot
        # e o serviço morre antes de servir a primeira requisição.
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [florescer]

  product-service:
    build:
      context: ./product-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/dbproduct
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Busca a chave no auth-service em vez de receber uma cópia: trocar a chave
      # lá passa a valer aqui sem redeploy. Ver JwtDecoderConfig.
      JWT_JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Documentacao viva ligada so aqui: em producao o padrao e desligado.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_PSEUDONYM_SALT: ${LOG_PSEUDONYM_SALT:-}
      UPLOADS_DIR: /var/florescer/uploads
    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8081}:8081"
    volumes:
      # As imagens ficam fora do container. Sem isto, todo produto cadastrado
      # perde a foto no próximo deploy, e a coluna no banco passa a apontar para
      # um arquivo que não existe mais.
      - product-uploads:/var/florescer/uploads
    depends_on:
      product-db:
        condition: service_healthy
      auth-service:
        # Precisa do JWKS do auth para validar qualquer token.
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [florescer]

  frontend:
    build:
      context: ./florescer-web
      args:
        # Sao nomes de servico da rede do Compose, iguais em qualquer ambiente.
        # Precisam ser argumento de build porque o Next resolve o destino dos
        # rewrites na hora do build; passa-los so no environment nao teria efeito
        # nenhum, e a falha seria silenciosa.
        PRODUCT_API: http://product-service:8081
        AUTH_API: http://auth-service:8080
    environment:
      # Repetidos aqui porque a renderizacao no servidor tambem os usa, agora em
      # runtime.
      PRODUCT_API: http://product-service:8081
      AUTH_API: http://auth-service:8080
      # Endereco publico da loja, usado pelo sitemap, pelo robots e pela previa
      # do link compartilhado. Em desenvolvimento e o proprio localhost.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      florescer:
        # Endereço fixo porque o auth-service confia neste, e só neste, para ler
        # o X-Forwarded-For. Ver APP_RATE_LIMIT_TRUSTED_PROXIES.
        ipv4_address: 172.28.0.10

# Volumes nomeados: sem eles o banco vive na camada gravável do container e some
# junto com ele no primeiro `docker compose down`.
volumes:
  auth-db-data:
  product-db-data:
  product-uploads:

# Rede única e explícita, para os serviços se acharem pelo nome e para o Compose
# não criar uma rede por projeto derivado do nome da pasta.
networks:
  florescer:
    driver: bridge
    # Sub-rede fixa, e não a que o Docker sortear.
    #
    # O limite de tentativas de login precisa saber de qual endereço o site fala
    # com o auth-service, para distinguir um visitante do outro. Com endereço
    # sorteado a cada `up`, essa configuração viraria um valor que dá certo hoje
    # e erra amanhã, e o erro é silencioso: o limite volta a ser uma cota só
    # para o mundo inteiro, e ninguém percebe até a vendedora não conseguir
    # entrar.
    ipam:
      config:
        - subnet: 172.28.0.0/16
