server:
  port: 8081

spring:
  # Identifica a origem da linha quando os dois servicos caem no mesmo
  # indice de log. Ver logback-spring.xml.
  application:
    name: product-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/dbproduct
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # O schema pertence as migrations do Flyway. Ver auth-service.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# SETTING THE SWAGGER ADDRESS
springdoc:
  swagger-ui:
    path: /swagger

# CHAVE PUBLICA DE VALIDACAO DO JWT
# COMO ESTE SERVICO DESCOBRE A CHAVE QUE VALIDA OS TOKENS
# Duas formas, e jwks-uri ganha quando as duas estao preenchidas:
#   jwks-uri     busca a chave no auth-service pelo kid do token. Trocar a chave
#                la passa a valer aqui sem redeploy. Preferir esta.
#   public-key   uma chave fixa em PEM (env/secret manager) ou um resource
#                classpath:/file:. Sem rotacao sem redeploy.
# Se nenhuma das duas estiver configurada o servico falha ao subir, de proposito:
# sem chave nao ha o que validar, e subir assim seria pior que nao subir.
jwt:
  public-key: ${RSA_PUBLIC_KEY:}
  jwks-uri: ${JWT_JWKS_URI:}
  issuer: ${JWT_ISSUER:auth-service}

# ORIGENS PERMITIDAS PELO NAVEGADOR (CORS)
# Lista separada por virgula. Sem curinga de proposito: liberar qualquer origem
# permitiria que outro site chamasse esta API em nome de quem esta navegando.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
  # Onde as imagens de produto sao gravadas. Fora do jar de proposito: dentro do
  # artefato elas sumiriam a cada deploy.
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  # Salt do pseudonimo de log. Precisa ser o mesmo entre reinicios para o
  # pseudonimo continuar comparavel ao longo do tempo, e secreto para que
  # ninguem consiga testar candidatos contra o log. Sem valor o pseudonimo ainda
  # funciona, so perde essa resistencia.
  logging:
    pseudonym-salt: ${LOG_PSEUDONYM_SALT:}

# ENDPOINT DE SAUDE (Actuator)
# Exposicao restrita a health, de proposito. O padrao do Actuator publica
# metrics, env, beans, loggers e mais; env e beans contam a configuracao inteira
# da aplicacao para quem perguntar, e nada disso e necessario aqui.
#
# show-details: never porque o detalhe do health revela componente interno,
# versao de banco e motivo da falha. Quem opera consulta o log; um health
# publico so precisa dizer se esta de pe.
#
# liveness e readiness sao coisas diferentes: liveness responde se o processo
# esta vivo (reiniciar resolve), readiness responde se ja pode receber trafego
# (esperar resolve). Reiniciar um servico que estava so aguardando o banco troca
# uma espera por uma interrupcao.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

