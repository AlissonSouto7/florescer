server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/dbproduct
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # O schema pertence as migrations do Flyway. Ver auth-service.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# SETTING THE SWAGGER ADDRESS
springdoc:
  swagger-ui:
    path: /swagger

# CHAVE PUBLICA DE VALIDACAO DO JWT
# Aceita o conteudo PEM (producao, via env/secret manager) ou um resource
# classpath:/file: (desenvolvimento). Ver JwtDecoderConfig.
# Sem default de proposito: subir sem a chave configurada aceitaria qualquer
# token, entao falhar no boot e o comportamento correto.
jwt:
  public-key: ${RSA_PUBLIC_KEY}
  issuer: ${JWT_ISSUER:auth-service}

# ORIGENS PERMITIDAS PELO NAVEGADOR (CORS)
# Lista separada por virgula. Sem curinga de proposito: liberar qualquer origem
# permitiria que outro site chamasse esta API em nome de quem esta navegando.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
