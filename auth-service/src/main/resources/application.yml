# DEFINING THE APPLICATION PORT 
server:
  port: 8080

# CONFIGURING THE DATABASE    
spring: 
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/authdb
    username: ${DB_USERNAME} 
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# RSA KEY PAIR
# Aceita o conteudo PEM (producao, via env/secret manager) ou um resource
# classpath:/file: (desenvolvimento). Ver JwtConfig.
jwt:
  private-key: ${RSA_PRIVATE_KEY:classpath:chaves/app.key}
  public-key: ${RSA_PUBLIC_KEY:classpath:chaves/app.pub}
  access-expiration: 3600

# SETTING THE SWAGGER ADDRESS  
springdoc:
  swagger-ui:
    path: /swagger
