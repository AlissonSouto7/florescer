# DEFINING THE APPLICATION PORT 
server:
  port: 8080

# CONFIGURING THE DATABASE    
spring: 
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/authdb
    username: ${DB_USERNAME} 
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # O schema pertence as migrations do Flyway. validate faz a aplicacao
      # recusar subir se as entidades e o banco discordarem, em vez de o
      # Hibernate alterar tabelas por conta propria.
      ddl-auto: validate
    show-sql: false

# RSA KEY PAIR
# Aceita o conteudo PEM (producao, via env/secret manager) ou um resource
# classpath:/file: (desenvolvimento). Ver JwtConfig.
# Sem default de proposito: um default faria a aplicacao subir assinando com
# uma chave que ninguem escolheu. Falhar no boot e o comportamento correto.
jwt:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}
  access-expiration: 3600

# SETTING THE SWAGGER ADDRESS
springdoc:
  swagger-ui:
    path: /swagger

# CONTA ADMINISTRATIVA INICIAL
# Desligada por padrao. Ligue apenas no primeiro boot de um ambiente novo, com
# e-mail e senha vindos do ambiente, e desligue depois. Sem valor padrao de
# proposito: senha padrao e conta conhecida por quem le o repositorio.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
  admin:
    enabled: ${ADMIN_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
