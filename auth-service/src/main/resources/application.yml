# DEFINING THE APPLICATION PORT 
server:
  port: 8080

# CONFIGURING THE DATABASE    
spring: 
  # Identifica a origem da linha quando os dois servicos caem no mesmo
  # indice de log. Ver logback-spring.xml.
  application:
    name: auth-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/authdb
    username: ${DB_USERNAME} 
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # O schema pertence as migrations do Flyway. validate faz a aplicacao
      # recusar subir se as entidades e o banco discordarem, em vez de o
      # Hibernate alterar tabelas por conta propria.
      ddl-auto: validate
    show-sql: false

# RSA KEY PAIR
# Aceita o conteudo PEM (producao, via env/secret manager) ou um resource
# classpath:/file: (desenvolvimento). Ver JwtConfig.
# Sem default de proposito: um default faria a aplicacao subir assinando com
# uma chave que ninguem escolheu. Falhar no boot e o comportamento correto.
#
# A parte PUBLICA deste par e publicada em /.well-known/jwks.json, com um kid
# derivado da propria chave. Quem valida os tokens deve apontar para esse
# endereco (JWT_JWKS_URI no product-service) em vez de receber uma copia da
# chave: assim trocar o par aqui nao exige mexer nos outros servicos.
jwt:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}
  access-expiration: 3600

# SETTING THE SWAGGER ADDRESS
springdoc:
  swagger-ui:
    path: /swagger
    # A documentacao viva sai do ar em producao, por padrao.
    #
    # Ela lista cada rota, cada campo e quem precisa de token: e o mapa pronto
    # do sistema para quem esta procurando por onde entrar. Em desenvolvimento
    # vale muito; publicada, so ajuda quem esta do outro lado.
    #
    # O padrao e DESLIGADO de proposito. Ligado por padrao, esquecer de desligar
    # publica tudo em silencio; desligado, o custo de esquecer e um Swagger que
    # nao abre em dev, que aparece na hora e se resolve numa linha.
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

# CONTA ADMINISTRATIVA INICIAL
# Desligada por padrao. Ligue apenas no primeiro boot de um ambiente novo, com
# e-mail e senha vindos do ambiente, e desligue depois. Sem valor padrao de
# proposito: senha padrao e conta conhecida por quem le o repositorio.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
  admin:
    enabled: ${ADMIN_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Salt do pseudonimo de log. Precisa ser o mesmo entre reinicios para o
  # pseudonimo continuar comparavel ao longo do tempo, e secreto para que
  # ninguem consiga testar candidatos contra o log. Sem valor o pseudonimo ainda
  # funciona, so perde essa resistencia.
  logging:
    pseudonym-salt: ${LOG_PSEUDONYM_SALT:}

# ENDPOINT DE SAUDE (Actuator)
# Exposicao restrita a health, de proposito. O padrao do Actuator publica
# metrics, env, beans, loggers e mais; env e beans contam a configuracao inteira
# da aplicacao para quem perguntar, e nada disso e necessario aqui.
#
# show-details: never porque o detalhe do health revela componente interno,
# versao de banco e motivo da falha. Quem opera consulta o log; um health
# publico so precisa dizer se esta de pe.
#
# liveness e readiness sao coisas diferentes: liveness responde se o processo
# esta vivo (reiniciar resolve), readiness responde se ja pode receber trafego
# (esperar resolve). Reiniciar um servico que estava so aguardando o banco troca
# uma espera por uma interrupcao.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

