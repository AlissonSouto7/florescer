# Configuracao valida apenas para os testes.
#
# O limite de tentativas fica fora do caminho por padrao: todos os testes chegam
# pelo mesmo endereco, entao dividiriam a mesma cota, e um teste de outro assunto
# passaria a receber 429 conforme a suite crescesse. Quem exercita o limite de
# proposito o reduz com @TestPropertySource, que tem precedencia sobre este
# arquivo.
app.rate-limit.max-attempts=10000

# Origem usada pelos testes de CORS.
app.cors.allowed-origins=http://localhost:3000
